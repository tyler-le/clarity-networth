name: deploy-to-prod

on:
  # Production is deliberately manual. This workflow always checks out dev,
  # tests that exact branch, then deploys that exact commit to production.
  workflow_dispatch:

# Development deploys are intentionally fast and ungated in deploy-to-dev.yml.
# Production has one guarded path: manually dispatch this workflow. Railway
# GitHub autodeploy must remain disconnected for production.
permissions:
  contents: read

concurrency:
  group: clarity-production-deploy
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: d8950f3f-2f64-408a-b183-7d5414306da1
  RAILWAY_SERVICE: clarity-networth
  RAILWAY_PRODUCTION_ENVIRONMENT: 583ca560-3c5a-4b8c-957b-6ee524e45fcc
  PRODUCTION_URL: https://clarity-networth-production.up.railway.app

jobs:
  verify:
    name: Targeted release checks
    outputs:
      tested_sha: ${{ steps.tested_commit.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - id: tested_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  production:
    name: Deploy tested development commit to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tested_sha }}
      - name: Deploy the tested development commit to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" --message "Production from dev $(git rev-parse HEAD)"
      - name: Smoke test production
        run: |
          # Same cold-start handling as staging. Production is only promoted
          # once the exact staged commit has passed its health check.
          for attempt in {1..12}; do
            health="$(curl --silent --show-error --max-time 60 "$PRODUCTION_URL/api/health" 2>&1 || true)"
            if printf '%s' "$health" | grep -q '"ok":true'; then
              curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL/" >/dev/null
              curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL/privacy" >/dev/null
              exit 0
            fi
            echo "Production is not healthy yet (attempt $attempt/12): $health" >&2
            sleep 5
          done
          echo "Production did not become healthy. Inspect Railway and roll back if needed." >&2
          exit 1
