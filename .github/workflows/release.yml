name: Release through staging

on:
  # Temporary pre-launch fallback only. Releases are promoted locally with
  # `npm run release:local`, so pushes do not consume GitHub Actions minutes
  # or automatically deploy anything.
  workflow_dispatch:

# Normal releases follow one local path: fast local verification, deployment to
# isolated staging, a health check, then promotion to production. This manual
# workflow remains available as a pre-launch fallback; Railway GitHub
# autodeploy stays disconnected so production cannot bypass an explicit release.
permissions:
  contents: read

concurrency:
  group: clarity-release
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: d8950f3f-2f64-408a-b183-7d5414306da1
  RAILWAY_SERVICE: clarity-networth
  RAILWAY_STAGING_ENVIRONMENT: d13ce25d-49d5-413d-98fa-979090d1ef05
  RAILWAY_PRODUCTION_ENVIRONMENT: 583ca560-3c5a-4b8c-957b-6ee524e45fcc
  STAGING_URL: https://clarity-networth-staging.up.railway.app
  PRODUCTION_URL: https://clarity-networth-production.up.railway.app

jobs:
  verify:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  staging:
    name: Deploy and verify staging
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy this verified commit to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_STAGING_ENVIRONMENT" --message "GitHub Actions $GITHUB_SHA"
      - name: Smoke test staging
        run: |
          # Railway may cold-start a sleeping service. Capture curl failures so
          # `bash -e -o pipefail` cannot abort the retry loop while it wakes.
          for attempt in {1..12}; do
            health="$(curl --silent --show-error --max-time 60 "$STAGING_URL/api/health" 2>&1 || true)"
            if printf '%s' "$health" | grep -q '"ok":true'; then
              curl --fail --silent --show-error --max-time 15 "$STAGING_URL/" >/dev/null
              curl --fail --silent --show-error --max-time 15 "$STAGING_URL/privacy" >/dev/null
              exit 0
            fi
            echo "Staging is not healthy yet (attempt $attempt/12): $health" >&2
            sleep 5
          done
          echo "Staging did not become healthy. Production was not deployed." >&2
          exit 1

  production:
    name: Promote verified commit to production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the staged commit to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT" --message "GitHub Actions $GITHUB_SHA"
      - name: Smoke test production
        run: |
          # Same cold-start handling as staging. Production is only promoted
          # once the exact staged commit has passed its health check.
          for attempt in {1..12}; do
            health="$(curl --silent --show-error --max-time 60 "$PRODUCTION_URL/api/health" 2>&1 || true)"
            if printf '%s' "$health" | grep -q '"ok":true'; then
              curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL/" >/dev/null
              curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL/privacy" >/dev/null
              exit 0
            fi
            echo "Production is not healthy yet (attempt $attempt/12): $health" >&2
            sleep 5
          done
          echo "Production did not become healthy. Inspect Railway and roll back if needed." >&2
          exit 1
