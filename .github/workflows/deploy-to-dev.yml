name: deploy-to-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarity-dev-deploy
  cancel-in-progress: true

env:
  RAILWAY_PROJECT_ID: d8950f3f-2f64-408a-b183-7d5414306da1
  RAILWAY_SERVICE: clarity-networth
  RAILWAY_DEV_ENVIRONMENT: d13ce25d-49d5-413d-98fa-979090d1ef05
  DEV_URL: https://clarity-networth-staging.up.railway.app

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Deploy development without a test gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: npx --yes @railway/cli@latest up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_DEV_ENVIRONMENT" --message "Development $(git rev-parse HEAD)"
      - name: Confirm development is serving
        run: |
          for attempt in {1..12}; do
            health="$(curl --silent --show-error --max-time 60 "$DEV_URL/api/health" 2>&1 || true)"
            if printf '%s' "$health" | grep -q '"ok":true'; then
              exit 0
            fi
            echo "Development is not healthy yet (attempt $attempt/12): $health" >&2
            sleep 5
          done
          echo "Development deployment did not become healthy." >&2
          exit 1
